; Mohar room monitor — ESP32-WROOM-32 (or ESP32-C3, see the second env).
;
;   pio run -e wroom32 -t upload
;   pio device monitor -b 115200
;
; The shared library lives outside this project so the witness station uses the
; identical canonicalisation and signing code. If the two ever diverged, one of
; them would start producing bodies the ledger cannot verify.

[platformio]
default_envs = wroom32

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    rweather/Crypto
    adafruit/RTClib
    adafruit/Adafruit_VL53L0X
    ncmreynolds/ld2410

[env:wroom32]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
