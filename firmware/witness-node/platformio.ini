; Mohar witness node - classic ESP32-WROOM-32 with an R307 fingerprint reader.
;
; The biometric half of the witness station. The frame is captured by the centre
; PC's own camera and committed separately under the same sessionId.

[env:witness-node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../shared
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    rweather/Crypto
    adafruit/RTClib
    adafruit/Adafruit Fingerprint Sensor Library
