[platformio]
default_envs = witness

; Mohar witness station — ESP32-S3-WROOM-1 with 8 MB PSRAM.
;
;   pio run -t upload
;   pio device monitor -b 115200
;
; PSRAM is not optional. A single OV2640 SVGA JPEG frame buffer does not fit in
; internal RAM alongside the Wi-Fi stack, and the failure mode without it is a
; brownout-looking reboot at the exact moment of capture — which is the one
; moment this device exists for.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_upload.flash_size = 8MB

lib_extra_dirs = ../shared

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    rweather/Crypto
    adafruit/RTClib
    adafruit/Adafruit Fingerprint Sensor Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; The station itself.
[env:witness]
build_src_filter = +<*> -<enrol.cpp> -<set_clock.cpp>

; Enrolment. Run once per person, per centre, per exam cycle, over the serial
; monitor — templates live on the R307's own flash and never leave it.
;   pio run -e enrol -t upload && pio device monitor -b 115200
[env:enrol]
build_src_filter = +<enrol.cpp>

; Set the DS3231 from the host clock, once, at build time.
;   pio run -e set_clock -t upload
[env:set_clock]
build_src_filter = +<set_clock.cpp>
